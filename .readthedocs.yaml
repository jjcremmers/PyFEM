# Read the Docs configuration file
# https://docs.readthedocs.com/platform/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  apt_packages:
    - libgl1

sphinx:
  configuration: doc/conf.py
  fail_on_warning: false

python:
  install:
    - method: uv
      command: sync
      extras:
        - docs

formats:
  - pdf
  - epub
