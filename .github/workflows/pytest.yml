name: PyFEM CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10" , "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Smoke test installed package
        run: |
          python -c "import pyfem; from importlib.metadata import version; assert pyfem.__version__ == version('pyfem')"
          pyfem --help
          mkdir -p /tmp/pyfem-smoke
          cp examples/ch02/PatchTest8.pro examples/ch02/PatchTest8.dat /tmp/pyfem-smoke/
          cd /tmp/pyfem-smoke
          pyfem PatchTest8.pro

      - name: Build package
        run: |
          python -m build --sdist --wheel --outdir /tmp/pyfem-dist

      - name: Run tests
        run: |
          coverage run -m pytest test
          coverage report           
