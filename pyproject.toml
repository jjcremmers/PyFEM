[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfem"
dynamic = ["version"]
description = "A Python finite element code (educational)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "J.J.C. Remmers" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "meshio",
  "h5py",
  "vtk",
]

[project.optional-dependencies]
gui = [
  "PySide6",
]
docs = [
  "sphinx>=7",
  "furo>=2024.8.6",
  "myst-parser>=2.0.0",
  "sphinx-autoapi>=2.0.0",
  "sphinx-copybutton>=0.5.0",
]
dev = [
  "pytest",
  "coverage",
  "build",
  "black",
  "mypy",
  "tomli>=2.0.1; python_version < '3.11'",
]
all = [
  "PySide6",
]

[project.scripts]
pyfem = "pyfem.core.cli:main"
pyfem-gui = "pyfem.gui.app:main"

[project.urls]
Homepage = "https://github.com/jjcremmers/PyFEM"
Issues = "https://github.com/jjcremmers/PyFEM/issues"
Documentation = "https://pyfem.readthedocs.io/"
Repository = "https://github.com/jjcremmers/PyFEM"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
include = ["pyfem", "pyfem.*"]

[tool.setuptools.dynamic]
version = { attr = "pyfem.__version__" }

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
